<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b5fef"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#f4f5f7"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#172b4d">Mini Kanban — User Flow</text>

  <!-- Start -->
  <ellipse cx="90" cy="120" rx="70" ry="34" fill="#5b5fef"/>
  <text x="90" y="125" font-size="13" fill="#fff" text-anchor="middle">Acessa o board</text>

  <!-- Load board -->
  <rect x="200" y="88" width="160" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="280" y="114" font-size="13" fill="#172b4d" text-anchor="middle">GET /api/tasks</text>
  <text x="280" y="132" font-size="13" fill="#172b4d" text-anchor="middle">Renderiza colunas</text>

  <!-- Decision -->
  <polygon points="460,60 560,120 460,180 360,120" fill="#fff" stroke="#dfe1e6"/>
  <text x="460" y="116" font-size="12" fill="#172b4d" text-anchor="middle">O que o</text>
  <text x="460" y="132" font-size="12" fill="#172b4d" text-anchor="middle">usuário faz?</text>

  <!-- Branch: Create -->
  <rect x="640" y="10" width="200" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="740" y="36" font-size="13" fill="#172b4d" text-anchor="middle">Clica "+ Nova tarefa"</text>
  <text x="740" y="54" font-size="13" fill="#172b4d" text-anchor="middle">Abre modal de criação</text>

  <rect x="900" y="10" width="240" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="1020" y="36" font-size="13" fill="#172b4d" text-anchor="middle">Preenche título/descrição</text>
  <text x="1020" y="54" font-size="13" fill="#172b4d" text-anchor="middle">POST /api/tasks → card no To Do</text>

  <!-- Branch: Edit -->
  <rect x="640" y="94" width="200" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="740" y="120" font-size="13" fill="#172b4d" text-anchor="middle">Clica no ícone ✎</text>
  <text x="740" y="138" font-size="13" fill="#172b4d" text-anchor="middle">Abre modal de edição</text>

  <rect x="900" y="94" width="240" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="1020" y="120" font-size="13" fill="#172b4d" text-anchor="middle">Altera dados e salva</text>
  <text x="1020" y="138" font-size="13" fill="#172b4d" text-anchor="middle">PUT /api/tasks/{id} → card atualizado</text>

  <!-- Branch: Drag -->
  <rect x="640" y="178" width="200" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="740" y="204" font-size="13" fill="#172b4d" text-anchor="middle">Arrasta o card</text>
  <text x="740" y="222" font-size="13" fill="#172b4d" text-anchor="middle">(drag and drop)</text>

  <rect x="900" y="178" width="240" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="1020" y="204" font-size="13" fill="#172b4d" text-anchor="middle">Solta em outra coluna/posição</text>
  <text x="1020" y="222" font-size="13" fill="#172b4d" text-anchor="middle">PUT /api/tasks/reorder → move o card</text>

  <!-- Branch: Delete -->
  <rect x="640" y="262" width="200" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="740" y="288" font-size="13" fill="#172b4d" text-anchor="middle">Clica no ícone ✕</text>
  <text x="740" y="306" font-size="13" fill="#172b4d" text-anchor="middle">Confirma exclusão</text>

  <rect x="900" y="262" width="240" height="64" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="1020" y="288" font-size="13" fill="#172b4d" text-anchor="middle">DELETE /api/tasks/{id}</text>
  <text x="1020" y="306" font-size="13" fill="#172b4d" text-anchor="middle">Card removido do board</text>

  <!-- Loop back -->
  <rect x="200" y="440" width="820" height="60" rx="10" fill="#eef0ff" stroke="#5b5fef" stroke-dasharray="4 4"/>
  <text x="610" y="468" font-size="13" fill="#4347c9" text-anchor="middle">
    Board permanece atualizado (estado local + persistência via API) — usuário pode repetir qualquer ação a qualquer momento
  </text>

  <!-- Connections -->
  <line x1="160" y1="120" x2="196" y2="120" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="120" x2="356" y2="120" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="560" y1="105" x2="636" y2="42" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="118" x2="636" y2="126" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="130" x2="636" y2="210" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="140" x2="636" y2="294" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="840" y1="42" x2="896" y2="42" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="126" x2="896" y2="126" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="210" x2="896" y2="210" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="294" x2="896" y2="294" stroke="#5b5fef" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1020" y1="74" x2="1020" y2="438" stroke="#9aa0f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="1020" y1="158" x2="1020" y2="438" stroke="#9aa0f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="1020" y1="242" x2="1020" y2="438" stroke="#9aa0f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="1020" y1="326" x2="1020" y2="438" stroke="#9aa0f0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <path d="M200,470 C130,470 130,120 156,120" stroke="#5b5fef" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="30" y="560" font-size="12" fill="#6b778c">Colunas do board:  To Do → Doing → Done  (o card pode se mover livremente entre elas)</text>
  <text x="30" y="580" font-size="12" fill="#6b778c">Todas as ações (criar, editar, mover, excluir) refletem imediatamente na UI e são persistidas via API REST no backend Go.</text>
</svg>
